
<div class="mt-6  pt-4 flex justify-center">
  <div class="w-full max-w-2xl text-center">
    <h2 class="text-2xl font-bold mb-4">Product Order List</h2>
  
    <div *ngFor="let row of orderRows; let i = index" class="flex items-center gap-4 justify-center mb-3">
      <!-- Product Dropdown -->
      <select [(ngModel)]="row.product" class="border p-2 rounded w-40">
        <option value="" disabled>Choose Product</option>
        <option *ngFor="let p of getAvailableProducts(row)" [value]="p">
          {{ p }}
        </option>
      </select>

  
      <!-- Quantity Dropdown -->
      <select [(ngModel)]="row.quantity" class="border p-2 rounded w-32">
        <option value="" disabled selected>Choose Quantity</option>
        <option *ngFor="let q of [0,1,2,3,4,5]" [value]="q">{{ q }}</option>
      </select>
  
      <!-- ADD Button -->
        <button
        (click)="addRow(i)"
        [disabled]="!row.product || row.quantity === null"
        class="bg-blue-500 text-white px-4 py-1 rounded hover:bg-blue-600 disabled:bg-gray-400"
        >
        ADD
        </button>
    </div>
  
    <!-- Show Order Button -->
    <button (click)="showOrder()" class="mt-4 bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">
      Show Order
    </button>
  </div>
</div>

<!-- Final Order Grid -->
<div *ngIf="showOrderList" class="mt-6  pt-4 flex justify-center">
  <div class="w-full max-w-2xl text-center">
    <h3 class="text-xl font-semibold mb-3">Your Order</h3>

    <table class="table-auto w-full text-left border mx-auto">
      <thead>
        <tr class="bg-gray-100">
          <th class="p-2 border">Product Name</th>
          <th class="p-2 border">Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of finalOrder">
          <td class="p-2 border">{{ item.product }}</td>
          <td class="p-2 border">{{ item.quantity }}</td>
        </tr>
      </tbody>
    </table>

    <!-- Speak Order Button -->
    <div class="mt-4">
      <button 
        (click)="speakOrder()" 
        class="bg-purple-600 text-white px-5 py-2 rounded hover:bg-purple-700"
      >
        What is my Order?
      </button>
    </div>
  </div>
</div>
